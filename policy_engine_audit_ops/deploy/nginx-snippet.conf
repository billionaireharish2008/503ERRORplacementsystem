# Inside the HTTPS server block. Limits and timeouts; adjust sizes with the placement office.
client_max_body_size      5m;
client_body_timeout       15s;
client_header_timeout     15s;
send_timeout              30s;
keepalive_timeout         15s;
large_client_header_buffers 4 8k;
proxy_read_timeout        30s;
proxy_connect_timeout     5s;
server_tokens off;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;   # declare in the http{} block
location = /accounts/login/ {            # adjust to your login URL
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://unix:/run/nfsu/gunicorn.sock;
}
location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://unix:/run/nfsu/gunicorn.sock;
}
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
